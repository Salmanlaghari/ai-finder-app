name: Android Native CI & Optimization Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & Optimize Native APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Generate Anti-Play Protect Keystore Signature
      run: |
        keytool -genkey -v \
          -keystore temp-keystore.jks \
          -alias premiumalias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass password123 \
          -keypass password123 \
          -dname "CN=Prince Laghari, OU=Mobile, O=Ai Latest Finder, L=Islamabad, S=Federal, C=PK"

    - name: Execute Optimized Compilation Build
      run: ./gradlew assembleDebug --no-daemon --parallel

    - name: Upload Verified Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ai-Latest-Finder-Native-Standard
        path: app/build/outputs/apk/debug/app-debug.apk
