name: Build & Release APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v \
          -keystore temp-keystore.jks \
          -alias premiumalias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass password123 \
          -keypass password123 \
          -dname "CN=Prince Laghari, OU=Mobile, O=Ai Latest Finder, L=Islamabad, S=Federal, C=PK"

    - name: Build Release APK & AAB
      run: ./gradlew assembleRelease bundleRelease --no-daemon --parallel

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Finder-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: AI-Finder-Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Create GitHub Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab
        generate_release_notes: true
        draft: false
        prerelease: false
